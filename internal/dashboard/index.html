<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorty Dashboard</title>
<style>body{font:15px system-ui,sans-serif;margin:0;background:#f6f7f9;color:#18202a}main{max-width:1100px;margin:auto;padding:28px}h1{margin:0 0 18px}.cards,.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}.card{background:#fff;border:1px solid #e1e5ea;border-radius:12px;padding:18px;box-shadow:0 1px 2px #0000000d}.big{font-size:30px;font-weight:700}.muted{color:#697386}.chart{height:240px;display:flex;align-items:end;gap:4px;border-bottom:1px solid #ccd2d9;padding:12px 0}.bar{flex:1;min-width:4px;background:#52606d;border-radius:4px 4px 0 0}.bars{display:grid;gap:10px}.row{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center}.track{height:9px;background:#e8ebef;border-radius:99px;overflow:hidden}.fill{height:100%;background:#52606d}.controls{display:flex;gap:8px;margin:14px 0}select,button{padding:9px 12px;border:1px solid #cbd1d8;border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:700px){.cards,.grid{grid-template-columns:1fr}main{padding:18px}}</style></head>
<body><main><h1>Shorty Dashboard</h1><div class="controls"><select id="link"><option>Loading links…</option></select><select id="interval"><option value="day">Daily</option><option value="hour">Hourly</option></select><button id="refresh">Refresh</button></div><section class="cards"><div class="card"><div class="muted">Lifetime clicks</div><div class="big" id="lifetime">—</div></div><div class="card"><div class="muted">Clicks in range</div><div class="big" id="range">—</div></div></section><section class="card" style="margin-top:14px"><h2>Click activity</h2><div class="chart" id="chart"></div></section><section class="grid"><div class="card"><h2>Referrers</h2><div class="bars" id="referrers"></div></div><div class="card"><h2>Countries</h2><div class="bars" id="countries"></div></div><div class="card"><h2>Browsers</h2><div class="bars" id="browsers"></div></div><div class="card"><h2>Devices</h2><div class="bars" id="devices"></div></div></section><section class="card" style="margin-top:14px"><h2>Recent links</h2><table><thead><tr><th>Slug</th><th>Destination</th><th>Clicks</th><th>Created</th></tr></thead><tbody id="links"></tbody></table></section></main>
<script>
const $=id=>document.getElementById(id);let links=[];
async function loadLinks(){const r=await fetch('/api/v1/links');if(!r.ok)throw Error('Could not load links');links=await r.json();$('link').innerHTML=links.map(x=>`<option value="${x.id}">${esc(x.slug)} — ${esc(x.url)}</option>`).join('')||'<option>No links</option>';$('links').innerHTML=links.slice().reverse().slice(0,20).map(x=>`<tr><td>${esc(x.slug)}</td><td title="${esc(x.url)}">${esc(x.url)}</td><td>${x.clicks||0}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('');if(links.length)await loadAnalytics();}
async function loadAnalytics(){const id=$('link').value;if(!id)return;const q=new URLSearchParams({interval:$('interval').value});q.set('from',new Date(Date.now()-7*864e5).toISOString());q.set('to',new Date(Date.now()+60e3).toISOString());const r=await fetch(`/api/v1/links/${encodeURIComponent(id)}/analytics?${q}`);if(!r.ok)throw Error('Could not load analytics');const d=await r.json();$('lifetime').textContent=d.lifetime_clicks||0;$('range').textContent=d.clicks_in_range||0;drawChart(d.buckets||[]);drawBreakdown('referrers',d.referrers||[]);drawBreakdown('countries',d.countries||[]);drawBreakdown('browsers',d.browsers||[]);drawBreakdown('devices',d.devices||[]);}
function drawChart(a){const max=Math.max(1,...a.map(x=>x.clicks));$('chart').innerHTML=a.map(x=>`<div class="bar" style="height:${Math.max(3,x.clicks/max*100)}%" title="${new Date(x.period).toLocaleString()}: ${x.clicks}"></div>`).join('')||'<span class="muted">No clicks in selected range.</span>';}
function drawBreakdown(id,a){const max=Math.max(1,...a.map(x=>x.clicks));$(id).innerHTML=a.map(x=>`<div><div class="row"><span>${esc(x.name)}</span><b>${x.clicks}</b></div><div class="track"><div class="fill" style="width:${x.clicks/max*100}%"></div></div></div>`).join('')||'<span class="muted">No data.</span>';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('link').addEventListener('change',loadAnalytics);$('interval').addEventListener('change',loadAnalytics);$('refresh').addEventListener('click',()=>loadLinks());loadLinks().catch(e=>document.querySelector('main').insertAdjacentHTML('beforeend',`<p class="muted">${esc(e.message)}</p>`));
</script></body></html>
