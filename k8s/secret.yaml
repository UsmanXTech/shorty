apiVersion: v1
kind: Secret
metadata:
  name: shorty-secret
  namespace: shorty
  labels:
    app.kubernetes.io/name: shorty
type: Opaque
stringData:
  # Signs password-unlock cookies. MUST be replaced with a long random value
  # before applying. Generate one with:
  #   openssl rand -base64 48
  # For production, prefer Sealed Secrets or External Secrets instead of
  # committing this file with a real value.
  SHORTY_SECRET: "CHANGE-ME-TO-A-LONG-RANDOM-STRING"
