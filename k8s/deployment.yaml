apiVersion: apps/v1
kind: Deployment
metadata:
  name: shorty
  namespace: shorty
  labels:
    app.kubernetes.io/name: shorty
spec:
  # SQLite has a single writer: exactly one replica, and Recreate so a new
  # pod never starts while the old one still holds the database.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shorty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shorty
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shorty
          # Replace with your registry/tag, e.g.
          # ghcr.io/usmanxtech/shorty:v0.2.0
          image: shorty:v0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shorty-config
            - secretRef:
                name: shorty-secret
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shorty-data
