apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shorty-data
  namespace: shorty
  labels:
    app.kubernetes.io/name: shorty
spec:
  # SQLite is a single-writer database: ReadWriteOnce is required and the
  # Deployment is pinned to a single replica.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
