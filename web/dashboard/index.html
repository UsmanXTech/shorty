<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorty Dashboard</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #e8ecf7; }
    main { max-width: 1100px; margin: auto; padding: 32px 20px 56px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:24px; }
    h1 { margin:0 0 6px; font-size:30px; } p { margin:0; color:#9da8c2; }
    button { border:0; border-radius:10px; padding:10px 15px; background:#6ea8fe; color:#08111f; font-weight:700; cursor:pointer; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
    .card { background:#121a2e; border:1px solid #26314c; border-radius:14px; padding:18px; }
    .label { color:#9da8c2; font-size:13px; } .value { font-size:27px; font-weight:750; margin-top:7px; }
    table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:12px 10px; border-bottom:1px solid #26314c; }
    th { color:#9da8c2; font-size:13px; } a { color:#9bc1ff; }
    .chart { width:100%; height:260px; display:block; } .muted { color:#7f8ba5; }
    .status { min-height:20px; color:#ffb4ab; margin:8px 0 14px; }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; } header { align-items:start; flex-direction:column; } table { font-size:13px; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>Shorty Dashboard</h1><p>Links, clicks, and recent analytics.</p></div><button id="refresh">Refresh</button></header>
  <div id="status" class="status"></div>
  <section class="grid">
    <div class="card"><div class="label">Links</div><div id="linkCount" class="value">—</div></div>
    <div class="card"><div class="label">Total clicks</div><div id="clickCount" class="value">—</div></div>
    <div class="card"><div class="label">Clicks (7 days)</div><div id="recentClicks" class="value">—</div></div>
  </section>
  <section class="card" style="margin-bottom:20px"><div class="label">Click activity — last 7 days</div><canvas id="chart" class="chart" height="260"></canvas></section>
  <section class="card"><div class="label" style="margin-bottom:10px">Recent links</div><table><thead><tr><th>Short link</th><th>Destination</th><th>Clicks</th><th>Created</th></tr></thead><tbody id="links"></tbody></table></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function setStatus(s='') { $('status').textContent = s; }
function draw(points) {
  const canvas=$('chart'), ctx=canvas.getContext('2d'), dpr=devicePixelRatio||1, w=canvas.clientWidth, h=260;
  canvas.width=w*dpr; canvas.height=h*dpr; ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  const max=Math.max(1,...points.map(p=>p.clicks)), pad=28, cw=Math.max(1,(w-pad*2)/Math.max(1,points.length-1));
  ctx.strokeStyle='#33415f'; ctx.beginPath(); ctx.moveTo(pad, h-pad); ctx.lineTo(w-pad,h-pad); ctx.stroke();
  ctx.strokeStyle='#6ea8fe'; ctx.lineWidth=2; ctx.beginPath();
  points.forEach((p,i)=>{ const x=pad+i*cw, y=h-pad-(p.clicks/max)*(h-pad*2); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  ctx.fillStyle='#9da8c2'; ctx.font='12px system-ui'; points.forEach((p,i)=>{ const x=pad+i*cw; if(i===0||i===points.length-1) ctx.fillText(p.label,Math.max(0,x-24),h-7); });
}
async function load() {
  setStatus('');
  try {
    const links=await fetch('/api/v1/links').then(r=>{if(!r.ok)throw Error('Could not load links');return r.json()});
    $('linkCount').textContent=links.length;
    $('clickCount').textContent=links.reduce((n,l)=>n+(l.clicks||0),0);
    const rows=links.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,10);
    $('links').innerHTML=rows.map(l=>`<tr><td><a href="/${encodeURIComponent(l.slug)}">/${esc(l.slug)}</a></td><td title="${esc(l.url)}">${esc(l.url)}</td><td>${l.clicks||0}</td><td>${new Date(l.created_at).toLocaleString()}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No links yet.</td></tr>';
    let total=0, series=[];
    for(const l of links){ const a=await fetch(`/api/v1/links/${l.id}/analytics?interval=day`).then(r=>r.ok?r.json():null); if(a){ total += a.clicks_in_range||0; series.push(a); } }
    $('recentClicks').textContent=total;
    const buckets={}; series.forEach(a=>(a.buckets||[]).forEach(p=>{buckets[p.period]=(buckets[p.period]||0)+p.clicks;}));
    const points=Object.entries(buckets).sort().slice(-7).map(([label,clicks])=>({label:label.slice(5,10),clicks}));
    draw(points.length?points:Array.from({length:7},()=>({label:'',clicks:0})));
  } catch(e) { setStatus(e.message||'Dashboard error'); }
}
$('refresh').addEventListener('click',load); window.addEventListener('resize',load); load();
</script>
</body>
</html>
