services:
  shorty:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SHORTY_ADDR: ":8080"
      SHORTY_DB: "/data/shorty.db"
      SHORTY_BASE_URL: "${SHORTY_BASE_URL:-http://localhost:8080}"
      SHORTY_GEOIP_DB: "${SHORTY_GEOIP_DB:-}"
      # Signs password-unlock cookies. Set a stable value (e.g. `openssl rand -base64 48`)
      # so unlock cookies survive restarts. Never commit a real value.
      SHORTY_SECRET: "${SHORTY_SECRET:-}"
    volumes:
      - shorty-data:/data
      # Optional local GeoIP CSV database:
      # - ./data/geoip.csv:/data/geoip.csv:ro

volumes:
  shorty-data:
